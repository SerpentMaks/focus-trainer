<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Фокус — тренировка внимания</title>
  <meta name="description" content="Короткие упражнения на реакцию, внимание и рабочую память. Работает офлайн.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Фокус">
  <meta name="theme-color" content="#F2F4F6" id="theme-color">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var p = JSON.parse(localStorage.getItem('focus.v1') || '{}').prefs || {};
      if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
